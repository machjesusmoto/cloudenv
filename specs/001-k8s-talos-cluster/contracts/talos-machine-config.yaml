# Talos Machine Configuration Contract
# Schema for controlplane.yaml.template
# Reference: https://www.talos.dev/v1.9/reference/configuration/
#
# This is a TEMPLATE - node-specific values use patches/

version: v1alpha1
debug: false
persist: true

machine:
  type: controlplane
  token: "${MACHINE_TOKEN}"  # Generated by talosctl gen secrets

  certSANs:
    - "10.9.8.100"           # VIP
    - "10.9.8.11"            # Node 1
    - "10.9.8.12"            # Node 2
    - "10.9.8.13"            # Node 3
    - "cloudenv-k8s"         # Cluster name

  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.31.4
    extraArgs:
      rotate-server-certificates: true
    defaultRuntimeSeccompProfileEnabled: true

  network:
    hostname: "${NODE_HOSTNAME}"  # Set via patch
    interfaces:
      - interface: eth0
        dhcp: false
        addresses:
          - "${NODE_IP}/24"      # Set via patch
        routes:
          - network: 0.0.0.0/0
            gateway: 10.9.8.1
        vip:
          ip: 10.9.8.100         # Shared VIP for Kubernetes API
    nameservers:
      - 10.9.8.1                 # Gateway DNS
      - 1.1.1.1                  # Cloudflare fallback

  install:
    disk: /dev/sda
    image: ghcr.io/siderolabs/installer:v1.9.1
    bootloader: true
    wipe: false
    extensions:
      - image: ghcr.io/siderolabs/qemu-guest-agent:v1.9.1

  features:
    rbac: true
    stableHostname: true
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:reader
      allowedKubernetesNamespaces:
        - kube-system

cluster:
  id: "${CLUSTER_ID}"                    # Generated by talosctl gen secrets
  secret: "${CLUSTER_SECRET}"            # Generated by talosctl gen secrets

  controlPlane:
    endpoint: https://10.9.8.100:6443    # VIP endpoint

  clusterName: cloudenv-k8s

  network:
    cni:
      name: none                         # Cilium installed separately
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12

  token: "${BOOTSTRAP_TOKEN}"            # Generated by talosctl gen secrets
  secretboxEncryptionSecret: "${SECRETBOX_SECRET}"  # Generated by talosctl gen secrets
  ca:
    crt: "${CLUSTER_CA_CRT}"             # Generated by talosctl gen secrets
    key: "${CLUSTER_CA_KEY}"             # Generated by talosctl gen secrets

  aggregatorCA:
    crt: "${AGGREGATOR_CA_CRT}"          # Generated by talosctl gen secrets
    key: "${AGGREGATOR_CA_KEY}"          # Generated by talosctl gen secrets

  serviceAccount:
    key: "${SERVICE_ACCOUNT_KEY}"        # Generated by talosctl gen secrets

  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.31.4
    certSANs:
      - "10.9.8.100"
    extraArgs:
      anonymous-auth: "false"
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1
          kind: PodSecurityConfiguration
          defaults:
            enforce: baseline
            enforce-version: latest
            warn: restricted
            warn-version: latest
            audit: restricted
            audit-version: latest
          exemptions:
            namespaces:
              - kube-system
              - democratic-csi
              - argocd

  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.31.4

  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.31.4

  proxy:
    disabled: true                       # Cilium replaces kube-proxy

  etcd:
    ca:
      crt: "${ETCD_CA_CRT}"              # Generated by talosctl gen secrets
      key: "${ETCD_CA_KEY}"              # Generated by talosctl gen secrets
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381

# Node-specific patches override these values:
# - machine.network.hostname
# - machine.network.interfaces[0].addresses
